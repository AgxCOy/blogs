content: |
  不知不觉就跑完一个月的单。虽然为了更多的闲暇选择兼职而非全职，但一个月下来也没什么鱼可摸。

  我做骑手本意也没什么，赚米还花呗（能有点积蓄就更好了），仅此而已。但偶然间我的鬼脑又发力了，我会倾向于是对自己的一种羞辱：反正我什么都不会，做廉价劳动力属于是恰如其分。有时候也能听到别人的议论，觉得我堂堂大学生沦落去送外卖，十分可惜。

  但，有什么办法呢？一切挣扎不过为了回答一个问题：我还能做什么呢？活着干什么呢？

  ……对了，不要误会。不活（或说死亡）当然也是一个答案，只是生与死于我而言没什么区别——活着找不到意义，死了就有意义么？顺其自然罢了。
